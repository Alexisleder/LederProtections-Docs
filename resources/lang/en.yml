        worldguard-region-id-empty: "&8- &c{id}: WorldGuard region id is empty."
        worldguard-orphan-region: "&8- &cWorldGuard: region &e{region} &cin world &e{world} &clooks like a LederProtections region, but it is not present in protections.yml."
