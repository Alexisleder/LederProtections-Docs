# ==================================================================================================
# LederProtections - English language file
# --------------------------------------------------------------------------------------------------
# Color format: use '&' as the Minecraft color code character.
# Placeholders: do not change text inside braces, for example {player}, {id}, {name}.
# Recommendation: keep text short so GUIs and chat remain clean.
# Brand: use &fLeder&bProtections for visible plugin branding.
# ==================================================================================================

messages:
  # -----------------------------------------------------------------------------------------------
  # General plugin messages
  # -----------------------------------------------------------------------------------------------
  plugin:
    enabled: "&fLeder&bProtections &aenabled."
    unlimited: "&aUnlimited"
    disabled: "&fLeder&bProtections &cdisabled."
    reloaded: "&aConfiguration reloaded."


  # -----------------------------------------------------------------------------------------------
  # Update checker
  # -----------------------------------------------------------------------------------------------
  update:
    available: "&eA new &fLeder&bProtections &eversion is available: &f{latest} &7(current: &f{current}&7)."
    download: "&7Download: &f{url}"

  # -----------------------------------------------------------------------------------------------
  # Action bar messages
  # -----------------------------------------------------------------------------------------------
  actionbar:
    protection-enter: "&aEntered &f{owner}&a's protection."
    protection-exit: "&eLeft &f{owner}&e's protection."

  preferences:
    actionbar-entry-exit-enabled: "&aProtection notices enabled."
    actionbar-entry-exit-disabled: "&7Protection notices disabled."

  # -----------------------------------------------------------------------------------------------
  # Internal console messages
  # -----------------------------------------------------------------------------------------------
  console:
    data-folder-create-failed: "Could not create the plugin data folder."
    stones-resource-missing: "stones.yml does not exist in resources. External file loading will be attempted if available."
    stone-section-missing: "Could not find the 'stones' section in stones.yml."
    stone-load-failed: "Could not load protection stone '{id}': {reason}"
    stone-none-loaded: "No protection stone types were loaded from stones.yml."
    stone-loaded-count: "Protection stone types loaded from stones.yml: {count}"

  # -----------------------------------------------------------------------------------------------
  # Command messages
