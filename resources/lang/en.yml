        type-missing: "&8- &c{id}: protection stone type &e{type} &cno longer exists in stones.yml."
        bounds-world-mismatch: "&8- &c{id}: bounds world (&e{bounds_world}&c) does not match record world (&e{record_world}&c)."
        bounds-height-outside-world: "&8- &c{id}: bounds Y (&e{min_y}..{max_y}&c) is outside world height (&e{world_min_y}..{world_max_y}&c)."
        stone-outside-bounds: "&8- &c{id}: registered stone at &e{x}, {y}, {z} &cis outside its own bounds."
        stone-height-outside-world: "&8- &c{id}: stone Y (&e{y}&c) is outside world height (&e{world_min_y}..{world_max_y}&c)."
