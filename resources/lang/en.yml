    no-permission: "&cNo permission."
    player-not-online: "&cPlayer is not online."
    invalid-amount: "&cInvalid amount."
    invalid-type: "&cInvalid type: &e{type}"
    available-types: "&7Types: &f{types}"
    protection-required: "&cStand inside a protection or provide its ID."
    protection-not-found: "&cProtection not found: &f{id}&c."
    invalid-toggle: "&cInvalid value. Use on/off."
    state-enabled: "&aYes"
    state-disabled: "&cNo"

    # Protection teleport home
    sethome-disabled: "&cSethome is disabled."
    sethome-no-access: "&cYou cannot change this teleport point."
    sethome-outside: "&cThe point must be inside the protection."
    sethome-unsafe: "&cThat point is not safe for teleporting."
    sethome-success: "&aTeleport point updated in &f{name}&a. &7{x}, {y}, {z}"

