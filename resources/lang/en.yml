    member-no-access: "&cYou cannot manage members here."
    member-player-unknown: "&cPlayer not found: &e{player}&c."
    member-is-owner: "&e{player} &cis the owner."
    member-already-added: "&e{player} &cis already a member."
    member-not-member: "&e{player} &cis not a member."
    member-worldguard-failed: "&cWorldGuard could not update members."
    member-add-success: "&aMember added: &e{player}&a."
    member-add-target: "&aYou are now a member of &e{id}&a."
    member-remove-success: "&aMember removed: &e{player}&a."
    member-list-empty: "&eNo members in &f{id}&e."
    member-list-header: "&aMembers of &e{id}&a:"

