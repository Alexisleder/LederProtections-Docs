# ==================================================================================================
# LederProtections - Archivo de idioma en español
# --------------------------------------------------------------------------------------------------
# Formato de colores: usa '&' como código de color de Minecraft.
# Placeholders: no cambies textos entre llaves, por ejemplo {player}, {id}, {name}.
# Recomendación: mantén los textos cortos para que se vean limpios en GUIs y chat.
# Marca: en textos visibles usa &fLeder&bProtections cuando se muestre el nombre del plugin.
# ==================================================================================================

messages:
