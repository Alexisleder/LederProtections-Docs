  # Mensajes generales del plugin
  # -----------------------------------------------------------------------------------------------
  plugin:
    enabled: "&fLeder&bProtections &aactivado."
    unlimited: "&aIlimitado"
    disabled: "&fLeder&bProtections &cdesactivado."
    reloaded: "&aConfiguración recargada."


  # -----------------------------------------------------------------------------------------------
  # Update checker
  # -----------------------------------------------------------------------------------------------
