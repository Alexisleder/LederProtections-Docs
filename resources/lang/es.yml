    available: "&eHay una nueva versión de &fLeder&bProtections&e: &f{latest} &7(actual: &f{current}&7)."
    download: "&7Descarga: &f{url}"

  # -----------------------------------------------------------------------------------------------
  # Mensajes de action bar
  # -----------------------------------------------------------------------------------------------
  actionbar:
    protection-enter: "&aEntraste a protección de &f{owner}&a."
    protection-exit: "&eSaliste de protección de &f{owner}&e."


  preferences:
