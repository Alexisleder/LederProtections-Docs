# GUI theme for server administrators. Zero-based slots; see docs/GUI_THEMES.md.
# Missing fields inherit the bundled layout. Invalid reloads keep the previous theme.
# HeadDatabase IDs must be quoted. Icons may use material, texture, base64, hdb,
# custom-model-data, item-model, name and lore. Never put executable commands here.
schema-version: 1
gui-style:
  default-heads: false
  clean-background: false
  border-material: CYAN_STAINED_GLASS_PANE
  fill-material: GRAY_STAINED_GLASS_PANE
  state-heads: false
  # Minecraft Heads: green-checkmark 21774 / red-x 56785. Empty = vanilla dye.
  allowed-head: "4312ca4632def5ffaf2eb0d9d7cc7b55a50c4e3920d90372aab140781f5dfbc4"
  denied-head: "27548362a24c0fa8453e4d93e68c5969ddbde57bf6666c0319c1ed1e84d89065"

# Enable only when your server sends a resource pack: use fallback-title until loaded.
pack-aware: false
# Optional category overrides; existing config.yml head-texture is the fallback.
category-icons: {}
