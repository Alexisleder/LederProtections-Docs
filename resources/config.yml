# Bukkit TextDisplay holograms. No NMS or external dependency is used.
#
# ES: enabled es el interruptor global. default-enabled solo controla las
# protecciones cuyo estado individual permanece en DEFAULT. Usa /lep reload.
# EN: enabled is the global switch. default-enabled only controls protections
# whose individual state remains DEFAULT. Apply changes with /lep reload.
holograms:
  enabled: true
  default-enabled: true
  height: 1.8
  # Distancia aproximada en bloques; internamente se convierte al rango de TextDisplay.
  view-distance: 32
  line-width: 240
  # ES: Variables propias disponibles:
  #     {title}/{name}: nombre de la protección; {owner}: dueño;
  #     {user}: nombre del jugador que está viendo el holograma (por jugador);
  #     {id}: ID persistente; {type}/{type_id}: tipo de piedra;
  #     {world}: mundo; {x}/{y}/{z} y {stone_x}/{stone_y}/{stone_z}: coordenadas de la piedra;
  #     {size_x}/{size_y}/{size_z}: dimensiones; {description}: descripción pública;
  #     {visibility}: visibilidad traducida; {category}: categoría; {visits}: visitas.
  # EN: Built-in variables: {title}/{name} protection name; {owner} protection owner;
  #     {user} name of the player viewing the hologram (per-viewer display);
  #     {id} persistent ID; {type}/{type_id} stone type; {world}; {x}/{y}/{z} or
  #     {stone_x}/{stone_y}/{stone_z} stone coordinates; {size_x}/{size_y}/{size_z}
  #     dimensions; {description}; {visibility}; {category}; {visits}.
  # ES/EN: PlaceholderAPI is optional. Use %expansion_placeholder% syntax,
  # including %player_name% and %lederprotections_*% when their expansions exist.
  # If an old custom line used {user} to mean the protection owner, replace it with {owner}.
  # PlaceholderAPI tokens use the current viewer as context and also enable
  # private nearby displays. Values refresh on block movement/reload, not every tick.
  # Color/format: &0-&9, &a-&f, &k-&o, &r. Example: "&bCasa".
  lines:
    - "&bBienvenid@ a {title}"
    - "&7Dueño: &f{owner}"
    - "&8{x}, {y}, {z}"
    - "&7{description}"
