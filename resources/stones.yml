# ============================================================
# LederProtections - Piedras de protección / Protection stones
# ============================================================
#
# ES: Este archivo define los tipos de piedras disponibles.
# EN: This file defines the available protection stone types.
#
# ES: Cada sección corresponde al ID usado en comandos:
# /lep give <jugador> <tipo> <cantidad>
# EN: Each section corresponds to the ID used in commands:
# /lep give <player> <type> <amount>
#
# ES: Los radios:
# - radius-x: este/oeste
# - radius-z: norte/sur
# - radius-y: vertical, -1 = altura completa
# EN: Radius values:
# - radius-x: east/west
# - radius-z: north/south
# - radius-y: vertical, -1 = full height
#
# ES: Tamaño horizontal real = radius * 2 + 1
# ============================================================

